name: Release

# Publica binários pré-compilados ao enviar uma tag de versão, e.g.
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      - run: make all
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" builds/* --title "$GITHUB_REF_NAME" --generate-notes
